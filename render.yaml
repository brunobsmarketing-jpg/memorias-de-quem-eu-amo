services:
  - type: web
    name: memorias-de-quem-eu-amo
    env: node
    plan: free
    buildCommand: npm install && npm run build && curl -L https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz -o /tmp/ffmpeg-full.tar.xz && mkdir -p ffmpeg-bin && tar -xJf /tmp/ffmpeg-full.tar.xz -C ffmpeg-bin --strip-components=1 && chmod +x ffmpeg-bin/bin/ffmpeg && rm /tmp/ffmpeg-full.tar.xz
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: APP_URL
        sync: false
